<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#d97706">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="クレーン提案">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>クレーン機種提案</title>
  <style>
    :root { --bg: #f4f5f7; --panel: #fff; --text: #1d2330; --muted: #5c6475; --border: #d6dae2; --accent: #d97706; --ng: #b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b5; --border: #2e3644; --ng: #f87171; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; padding: 16px; }
    form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--border); border-top: 4px solid var(--accent);
      border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    input[type=password] { font: inherit; font-size: 18px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text); width: 100%; }
    label.keep { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    button { font: inherit; font-size: 16px; font-weight: 700; padding: 12px; border: none; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; }
    .error { color: var(--ng); min-height: 1.2em; }
  </style>
</head>
<body>
  <form id="unlock" hidden>
    <h1>クレーン機種提案</h1>
    <p>パスワードを入力してください。</p>

    <label class="keep"><input id="keep" type="checkbox" checked> この端末で記憶する（次回から入力不要・圏外でも開けます）</label>
    <button id="go" type="submit">開く</button>
    <p class="error" id="err" role="alert"></p>
  </form>

    var STORE = "crane-plan.key.v1";
    function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
    function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }

    function open(key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data)).then(function (buf) {
        var doc = new TextDecoder().decode(buf);
        document.open();
        document.write(doc);
        document.close();
      });
    }
    function derive(pw) {
      return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(P.salt), iterations: P.iter },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
    }
    function showForm(msg) {
      document.getElementById("unlock").hidden = false;
      document.getElementById("err").textContent = msg || "";
      document.getElementById("pw").focus();
    }

    if (!window.crypto || !crypto.subtle) { showForm("この画面は https で開いてください。"); return; }

    document.getElementById("unlock").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = document.getElementById("go");
      btn.disabled = true; btn.textContent = "確認中…";
      var keep = document.getElementById("keep").checked;
      derive(document.getElementById("pw").value).then(function (key) {
        return open(key).then(function () {
          if (keep) return crypto.subtle.exportKey("raw", key).then(function (raw) {
            store(STORE, btoa(String.fromCharCode.apply(null, new Uint8Array(raw))));
          });
        });
      }).catch(function () {
        btn.disabled = false; btn.textContent = "開く";
        showForm("パスワードが違います。");
      });
    });

    var saved = load(STORE);
    if (saved) {
      crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"]).then(open).catch(function () {
        store(STORE, null);   // パスワードが変わった・記憶した鍵が壊れた
        showForm();
      });
    } else {
      showForm();
    }
  })();
